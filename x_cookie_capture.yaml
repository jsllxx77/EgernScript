name: "X Cookie 捕获"
description: "MITM 捕获 X app/网页的 auth_token + ct0：变化时自动推送到服务器更新 parse_hub_bot，并通知一键复制。打开 X app 刷一下即可触发；也可在脚本列表手动运行「X Cookie 导出」查看。"
author: "Shawn & Ali"
homepage: "https://github.com/jsllxx77/EgernScript"
icon: "bird.fill"

env_schema:
  X_COOKIE_KEY:
    name: 推送密钥
    description: "服务器端 x-cookie-update.php 的 key（https://wyy.wi11.de/x-cookie-update.php）"
    default_value: ""

scriptings:
  - http_request:
      name: "X Cookie 捕获"
      match: "^https://(api\\.twitter\\.com|api\\.x\\.com|twitter\\.com|x\\.com)/.*$"
      script_url: "https://raw.githubusercontent.com/jsllxx77/EgernScript/ab4084a27192d3d262c6419e968e2692677a34e4/x_cookie_capture.js"
      update_interval: 86400
      max_size: 131072
      timeout: 15
      body_required: false
      env:
        X_COOKIE_KEY: ""
  - generic:
      name: "X Cookie 导出"
      script_url: "https://raw.githubusercontent.com/jsllxx77/EgernScript/ab4084a27192d3d262c6419e968e2692677a34e4/x_cookie_capture.js"
      update_interval: 86400
      timeout: 15
      env:
        X_COOKIE_KEY: ""

mitm:
  hostnames:
    includes:
      - "api.twitter.com"
      - "twitter.com"
      - "x.com"
